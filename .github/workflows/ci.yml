name: CI


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs: 
  test:
    runs-on: ubuntu-latest

    strategy:                            
      fail-fast: false                   
      matrix:                           
        python-version: ["3.11", "3.12"]  


    steps:        
    
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5    
        with: 
            python-version: ${{ matrix.python-version }}     
            cache: "pip"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter             
        run: flake8 . 

      - name: Run tests
        run: pytest -q --junitxml=report.xml   

      - name: Upload test report
        if: always()                                 
        uses: actions/upload-artifact@v4             
        with:
          name: test-report                         
          path: report.xml                           

  smoke: 
    needs: test                 #dependecy
    runs-on: ubuntu-latest
  
    steps:
       - name: Check out code
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
          python-version: "3.12"
          cache: "pip"
      
       - name: Install dependencies
         run: pip install -r requirements.txt

       - name: Start the API
         run: |
          APP_VERSION=ci-${{ github.run_number }} python app.py &                 
          sleep 5

        # APP_VERSION sets the API version using the current CI run number.
        # python app.py & = starts the API and lets GitHub move on with the workflow
        # sleep 5 = wait for 5sec, then start sending requests to the server 
      
       - name: Check status code
         run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz)

          echo "got $code"

          test "$code" = "200"


       - name: Check readiness
         run: |
          curl -s http://127.0.0.1:5000/readyz | grep '"servers_loaded":9'
      

       - name: Check version
         run: |
           curl -s http://127.0.0.1:5000/version | grep "ci-${{ github.run_number }}"

        # explanation: Call /version and verify that the response contains the current CI run number.
