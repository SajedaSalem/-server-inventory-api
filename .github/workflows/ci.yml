name: CI


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs: 
  test:
    runs-on: ubuntu-latest

    strategy:                            
      fail-fast: false                   
      matrix:                           
        python-version: ["3.11", "3.12"]  


    steps:        
    
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5    
        with: 
            python-version: ${{ matrix.python-version }}     
            cache: "pip"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter             
        run: flake8 . 

      - name: Run tests
        run: pytest -q --junitxml=report.xml   

      - name: Upload test report
        if: always()                                 
        uses: actions/upload-artifact@v4             # We're using GitHub's upload-artifact action. An artifact is basically a file produced during a workflow that you want to save and access later
        with:
          name: test-report                          # how we want to name the uploaded artifact
          path: report.xml                           # tells the action to upload the file called report.xml (remember, pytest creates that file)

          ##why do we need if: always() ?
          # the "upload  test report"-step comes AFTER the "Runs tests"-step. 
          # Suppose pytest ("Runs tests"-step) fails -- normally, GitHub won't continue to the upload step. But we want the report specifically when tests fail.
          # solution ->  if: always() 
          # if: always() = run the upload step regardless of whether an earlier step failed.